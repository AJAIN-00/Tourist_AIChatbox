{% extends "base.html" %}

{% block title %}{{ code }} Error - Tamil Nadu Tourist Guide{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 280px);">
    <div class="text-center">
        <div style="font-size: 6rem; font-weight: 800; color: var(--primary); opacity: 0.8;">{{ code }}</div>
        <h1 class="heading-serif text-white mb-3">{{ message | e }}</h1>
        <p class="text-muted mb-4">We couldn't complete your request. Please try again or return to the homepage.</p>
        <a href="{{ url_for('home') }}" class="btn-premium px-5 py-3">
            <i class="bi bi-house-fill me-2"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
